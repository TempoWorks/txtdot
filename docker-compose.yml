services:
  txtdot-firewall:
    build:
      context: .
      dockerfile: Dockerfile.egress
    environment:
      PORT: 8080
    ports:
      - "${PORT:-8080}:8080"
    networks:
      - proxy-egress
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=1m,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/firewall-ready"]
      interval: 2s
      timeout: 1s
      retries: 10

  txtdot:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      txtdot-firewall:
        condition: service_healthy
    network_mode: service:txtdot-firewall
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      TIMEOUT: ${TIMEOUT:-0}
      REVERSE_PROXY: ${REVERSE_PROXY:-false}
      PROXY_DOCUMENTS: ${PROXY_DOCUMENTS:-true}
      PROXY_IMAGES: ${PROXY_IMAGES:-true}
      PROXY_MEDIA: ${PROXY_MEDIA:-true}
      PROXY_FILES: ${PROXY_FILES:-true}
      IMG_PROCESS: ${IMG_PROCESS:-true}
      IMG_OPTIMIZE_BY_DEFAULT: ${IMG_OPTIMIZE_BY_DEFAULT:-true}
      SWAGGER: ${SWAGGER:-false}
      SEARCH_BY_DEFAULT: ${SEARCH_BY_DEFAULT:-false}
      SEARX_URL: ${SEARX_URL:-}
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

networks:
  proxy-egress:
    name: txtdot-proxy-egress
    driver: bridge
    attachable: false
